import groovy.json.JsonSlurper

buildscript {
  // Fallbacks, used only when the host's root project does not define these (see
  // getExtOrDefault). They track the SDK's OWN baseline, which v1.0.1-alpha-10 deliberately
  // lowered so a stock React Native 0.81 Android host consumes the AARs without upgrading
  // anything: Kotlin 2.1.x metadata, compileSdk 36, Java 11 bytecode, AGP 8.x.
  //
  // These were 2.4.10 / 37 up to alpha-08, whose AARs carried Kotlin 2.4 metadata that a 2.2
  // compiler could not read at all. That is no longer true, so the floors come back down — a
  // library must not drag every host onto a bleeding-edge toolchain it no longer needs.
  ext.Tracker = [
    kotlinVersion: "2.1.20",
    minSdkVersion: 26,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }
    return Tracker[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.13.0"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

// §4.1 — one place to bump the SDK version. Read from package.json at configure time so the
// pin lives with the rest of the package metadata, not duplicated in Gradle.
def packageJson = new JsonSlurper().parseText(file("${projectDir}/../package.json").text)
def trackerAndroidVersion = packageJson.tracker.android

android {
  namespace "com.fieldtrack360.tracker"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.github.fieldtrack360:fieldtrack:${trackerAndroidVersion}"
  // OkHttp is compileOnly inside fieldtrack-sync/-snap, so a host that wants their built-in HTTP
  // paths supplies it. Pinned to the version the SDK itself builds against: Retrofit 3 and OkHttp 5
  // are versioned together, and fieldtrack-core already brings Retrofit 3.0.0 transitively (it is a
  // real dependency there, because the licence check must work in a host that brought no client).
  implementation "com.squareup.okhttp3:okhttp:5.1.0"
  // Match the SDK's own pin rather than overriding it. 20.0.0 ships Kotlin 2.3 metadata, which the
  // Kotlin 2.1.x compiler an RN 0.81 host uses cannot read; declaring it here would win through
  // Gradle conflict resolution and put it back on the classpath the SDK removed it from.
  implementation "com.google.android.gms:play-services-maps:19.2.0"
}