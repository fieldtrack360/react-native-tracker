apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
/**
 * Where node actually put a package, rather than where a relative path guesses it is.
 *
 * The plugin's defaults assume the app's own `node_modules` holds react-native. In this workspace
 * npm hoists it to the REPO ROOT, so every default below resolves to a directory that does not
 * exist and the build fails with "…/example/node_modules/react-native/ReactAndroid/gradle.properties
 * (No such file or directory)". Asking node is correct under any install strategy — hoisted,
 * nested, or a plain non-workspace consumer.
 */
def resolvePackage(String specifier) {
    def process = ["node", "--print", "require.resolve('${specifier}')"].execute(null, rootDir)
    def stdout = new StringBuilder()
    def stderr = new StringBuilder()
    process.waitForProcessOutput(stdout, stderr)
    def path = stdout.toString().trim()
    // Reported, not swallowed: `new File("")` resolves to the PROJECT DIRECTORY, which then becomes
    // a task input covering every build output underneath it. Gradle 9 rejects that as an undeclared
    // implicit dependency, and the release build dies far from the actual cause.
    if (process.exitValue() != 0 || path.isEmpty()) {
        throw new GradleException(
            "Could not resolve '${specifier}' from ${rootDir}: ${stderr.toString().trim()}"
        )
    }
    return new File(path)
}

/**
 * The Google Maps key, read from local.properties — which is gitignored, so the key never reaches
 * the repository. The SDK's TrackRenderer / LiveTrackRenderer need it; without one the map surface
 * comes up blank at runtime with only a logcat line to explain it, so an absent key is reported at
 * BUILD time instead.
 *
 * Groovy, not Kotlin: this is build.gradle. `val name: Type = …` parses here as an assignment to
 * the class String and fails configuration with "you tried to assign a value to the class
 * java.lang.String".
 */
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// The licence token is deliberately NOT read here. It reaches the SDK through
// TrackerConfig.license at ready(), inlined into JS from example/.env — one route on both
// platforms. The Android integration guide withdrew the manifest meta-data route, so a token
// plumbed through local.properties into BuildConfig would have nowhere to go.

def mapsApiKey = localProperties.getProperty("MAPS_API_KEY", "")
if (!mapsApiKey) {
    logger.warn(
        "MAPS_API_KEY is not set in example/android/local.properties — the app will build and run, " +
        "but every map surface will render blank. Add MAPS_API_KEY=<your key> to that file."
    )
}

react {
    /* Folders */
    root = file("../../")
    reactNativeDir = resolvePackage("react-native/package.json").parentFile
    codegenDir = resolvePackage("@react-native/codegen/package.json").parentFile
    // Derived from package.json, NOT `require.resolve("react-native/cli.js")`: RN's `exports` map
    // does not publish ./cli.js, so resolving it directly throws ERR_PACKAGE_PATH_NOT_EXPORTED.
    cliFile = new File(resolvePackage("react-native/package.json").parentFile, "cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    // Asked of node for the same reason as the folders above — the default,
    // "node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc", is resolved against `root`, where
    // this workspace has no node_modules at all. It also names a directory React Native no longer
    // ships: hermesc now lives in the separate `hermes-compiler` package. `%OS-BIN%` is a
    // placeholder the plugin substitutes per host OS (osx-bin / linux64-bin / win64-bin).
    hermesCommand = new File(
        resolvePackage("hermes-compiler/package.json").parentFile,
        "hermesc/%OS-BIN%/hermesc"
    ).path
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.fieldtrack360.tracker.rnsample"

    buildFeatures {
        // Required for the buildConfigField below: BuildConfig generation is off by default in
        // AGP 8+.
        buildConfig true
    }

    defaultConfig {
        applicationId "com.fieldtrack360.tracker.rnsample"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // Index assignment, NOT `manifestPlaceholders = [...]`: React Native injects its own
        // ${usesCleartextTraffic} placeholder, and replacing the map wholesale drops it.
        manifestPlaceholders["MAPS_API_KEY"] = mapsApiKey
        buildConfigField("String", "MAPS_API_KEY", "\"$mapsApiKey\"")
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}