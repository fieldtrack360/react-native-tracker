buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        // React Native 0.81's own baseline, and it is enough again. This host used to override
        // to 2.4.10 because the Tracker AAR up to v1.0.1-alpha-08 carried Kotlin 2.4 metadata that
        // a 2.2 compiler could not read at all. alpha-10 rebuilt the AARs at Kotlin 2.1.x metadata
        // / compileSdk 36 / Java 11 bytecode precisely so an RN host needs no override.
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"